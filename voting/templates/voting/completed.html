{% extends "voting/main.html" %}
{% block title %}Voting Completed{% endblock %}
{% block header %}Thank You!{% endblock %}

{% block body %}
<div class="center-shell">
    <div class="container" style="max-width: 460px;">
        <div class="card card-pad" style="text-align:center;">
            <div style="width:88px; height:88px; border-radius:50%; background: var(--success); color:#fff; display:flex; align-items:center; justify-content:center; margin: 0 auto 1.25rem;">
                <i class="bi bi-check-lg" style="font-size: 2.5rem;"></i>
            </div>
            <h2>Vote Recorded!</h2>
            <p style="color: var(--ink-soft); margin: .75rem 0 1.5rem;">
                Thank you for voting in the BME departmental election. Your voice has been counted.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary"><i class="bi bi-box-arrow-right"></i> Done</a>
        </div>
    </div>
</div>
{% endblock %}
