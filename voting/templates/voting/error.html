{% extends "voting/main.html" %}
{% block title %}Something Went Wrong{% endblock %}
{% block header %}Something Went Wrong{% endblock %}

{% block body %}
<div class="center-shell">
    <div class="container" style="max-width: 460px;">
        <div class="card card-pad" style="text-align:center;">
            <i class="bi bi-exclamation-triangle" style="font-size: 2.5rem; color: var(--danger);"></i>
            <h2 style="margin-top:.75rem;">Oops!</h2>
            <p style="color: var(--ink-soft); margin: .75rem 0 1.5rem;">{{ message|default:"Something went wrong. Please try again." }}</p>
            <a href="{% url 'login' %}" class="btn btn-primary"><i class="bi bi-house"></i> Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
